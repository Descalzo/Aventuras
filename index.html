<!--
  v=12 fuerza al navegador/PWA a descargar la versión actual del CSS
  en lugar de reutilizar una copia antigua.
-->
<link rel="stylesheet" href="css/style.css?v=12">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<!--
  Los bloques de interfaz se identifican con data-slot.
  El render (js/engine/render.js) los busca por ese atributo.

  Los escenarios y primeros planos se construyen dinámicamente dentro de
  [data-slot=room] y [data-slot=closeup] a partir de js/scenes/*.js.
-->

<div class="game">
  <main class="stage" id="stage" data-slot="stage">

    <!-- VISTA: escenarios -->
    <div class="view" data-slot="room"></div>

    <!-- VISTA: primeros planos -->
    <div class="view" data-slot="closeup" hidden>
      <button type="button" class="back" data-slot="back">← Volver</button>
    </div>

    <!-- Efectos transitorios -->
    <div class="fx" data-slot="fx"></div>
    <div class="curtain" data-slot="curtain"></div>

    <!-- HUD -->
    <div class="hud">

      <div class="top-bar">

        <div
          class="scene-name"
          data-slot="scene-name">
        </div>

        <div
          class="inventory"
          data-slot="inventory"
          aria-label="Inventario">
        </div>

        <div class="hud-actions">

          <button
            type="button"
            data-action="notes"
            aria-expanded="false"
            title="Notas y progreso">

            <span class="ico">📖</span>
            <span class="txt">Notas</span>
            <span
              class="badge"
              data-slot="notes-count"
              hidden>
            </span>

          </button>


          <button
            type="button"
            data-action="phases"
            aria-expanded="false"
            title="Elegir aventura">

            <span class="ico">🗺️</span>
            <span class="txt">Aventuras</span>

          </button>


          <button
            type="button"
            data-action="hint"
            title="Pista">

            <span class="ico">💡</span>
            <span class="txt">Pista</span>

          </button>


          <button
            type="button"
            data-action="mute"
            aria-pressed="false"
            title="Silenciar">

            <span class="ico">🔊</span>

          </button>


          <button
            type="button"
            data-action="reset"
            title="Reiniciar">

            <span class="ico">↻</span>
            <span class="txt">Reiniciar</span>

          </button>

        </div>
      </div>


      <!-- Mensajes del juego -->
      <div
        class="message"
        data-slot="message"
        aria-live="polite">
      </div>


      <!-- Confirmación visual al recoger objetos -->
      <div
        class="pickup-toast"
        data-slot="pickup-toast"
        hidden
        aria-hidden="true">

        <img
          data-slot="pickup-toast-img"
          alt="">

      </div>


      <!-- Notas -->
      <aside
        class="notes-panel"
        data-slot="notes-panel"
        hidden>

        <h3>Notas</h3>

        <div
          class="notes"
          data-slot="notes">
        </div>

        <h3>Progreso</h3>

        <div
          class="progress"
          data-slot="progress">
        </div>

      </aside>


      <!-- Selector de aventuras -->
      <aside
        class="phases-panel"
        data-slot="phases-panel"
        hidden>

        <h3>Aventuras</h3>

        <div
          class="phases-list"
          data-slot="phases-list">
        </div>

        <p class="phases-note">
          Cada aventura guarda su propio progreso por separado.
        </p>

      </aside>

    </div>


    <!-- Final de la aventura -->
    <div
      class="ending"
      data-slot="ending"
      hidden>

      <div class="box">

        <h2 data-slot="ending-title">
          Has escapado
        </h2>

        <p data-slot="ending-text"></p>

        <button
          type="button"
          data-action="reset">
          Jugar de nuevo
        </button>

      </div>

    </div>

  </main>
</div>

<!-- SERVICE WORKER                                            -->
<!-- ========================================================= -->

<script>
(function () {

  function actualizarViewport() {

    const viewport = window.visualViewport;

    const ancho = viewport
      ? viewport.width
      : window.innerWidth;

    const alto = viewport
      ? viewport.height
      : window.innerHeight;

    document.documentElement.style.setProperty(
      "--app-vw",
      ancho + "px"
    );

    document.documentElement.style.setProperty(
      "--app-vh",
      alto + "px"
    );

    // Fuerza al navegador a recalcular el layout
    void document.documentElement.offsetHeight;
  }


  // Primera medición
  actualizarViewport();


  // Cuando Android/Brave cambie realmente el viewport
  window.addEventListener("resize", actualizarViewport);
  window.addEventListener("orientationchange", actualizarViewport);
  window.addEventListener("pageshow", actualizarViewport);


  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      "resize",
      actualizarViewport
    );
  }


  /*
   * Brave/HyperOS puede tardar unas décimas en terminar
   * de establecer fullscreen/landscape.
   * Lo comprobamos varias veces después del arranque.
   */
  requestAnimationFrame(() => {
    requestAnimationFrame(actualizarViewport);
  });

  setTimeout(actualizarViewport, 250);
  setTimeout(actualizarViewport, 700);
  setTimeout(actualizarViewport, 1500);

})();
</script>
  
<script>
if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("./sw.js?v=12", {
      updateViaCache: "none"
    })

    .then(reg => {

      console.log(
        "Service Worker registrado:",
        reg.scope
      );

      /*
       * Fuerza una comprobación de actualización.
       * No borra datos ni progreso del juego.
       */
      reg.update();

    })

    .catch(err => {

      console.error(
        "Error Service Worker:",
        err
      );

    });

  });

}
</script>
