<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventuras</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<!--
  Los bloques de interfaz se identifican con data-slot. El render (js/engine/render.js)
  los busca por ese atributo. Los escenarios y primeros planos se construyen
  dinámicamente dentro de [data-slot=room] y [data-slot=closeup] a partir de js/scenes/*.js.
-->
<div class="game">
  <main class="stage" id="stage" data-slot="stage">

    <!-- VISTA: escenarios (base + overlays + hotspots), uno por escenario registrado -->
    <div class="view" data-slot="room"></div>

    <!-- VISTA: primeros planos -->
    <div class="view" data-slot="closeup" hidden>
      <button type="button" class="back" data-slot="back">← Volver</button>
    </div>

    <!-- Efectos transitorios: pulsos y fundido entre vistas -->
    <div class="fx" data-slot="fx"></div>
    <div class="curtain" data-slot="curtain"></div>

    <!-- HUD: interfaz superpuesta al escenario. Sin franja fija de fondo: una sola
         franja delgada arriba (nombre + inventario en línea + botones), y paneles de
         notas/aventuras que se abren bajo demanda. El resto del escenario -sobre
         todo toda la parte inferior- queda siempre libre para los hotspots. -->
    <div class="hud">
      <div class="top-bar">
        <div class="scene-name" data-slot="scene-name"></div>
        <div class="inventory" data-slot="inventory" aria-label="Inventario"></div>
        <div class="hud-actions">
          <button type="button" data-action="notes" aria-expanded="false" title="Notas y progreso">
            <span class="ico">📖</span><span class="txt">Notas</span><span class="badge" data-slot="notes-count" hidden></span>
          </button>
          <button type="button" data-action="phases" aria-expanded="false" title="Elegir aventura">
            <span class="ico">🗺️</span><span class="txt">Aventuras</span>
          </button>
          <button type="button" data-action="hint" title="Pista"><span class="ico">💡</span><span class="txt">Pista</span></button>
          <button type="button" data-action="mute" aria-pressed="false" title="Silenciar"><span class="ico">🔊</span></button>
          <button type="button" data-action="reset" title="Reiniciar"><span class="ico">↻</span><span class="txt">Reiniciar</span></button>
        </div>
      </div>

      <div class="message" data-slot="message" aria-live="polite"></div>

      <!-- Confirmación visual al recoger un objeto: aparece en el centro, breve, y
           desaparece del todo (sin overlay residual) — ver TD.render.effects(). -->
      <div class="pickup-toast" data-slot="pickup-toast" hidden aria-hidden="true">
        <img data-slot="pickup-toast-img" alt="">
      </div>

      <aside class="notes-panel" data-slot="notes-panel" hidden>
        <h3>Notas</h3>
        <div class="notes" data-slot="notes"></div>
        <h3>Progreso</h3>
        <div class="progress" data-slot="progress"></div>
      </aside>

      <aside class="phases-panel" data-slot="phases-panel" hidden>
        <h3>Aventuras</h3>
        <div class="phases-list" data-slot="phases-list"></div>
        <p class="phases-note">Cada aventura guarda su propio progreso por separado.</p>
      </aside>
    </div>

    <div class="ending" data-slot="ending" hidden>
      <div class="box">
        <h2 data-slot="ending-title">Has escapado</h2>
        <p data-slot="ending-text"></p>
        <button type="button" data-action="reset">Jugar de nuevo</button>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
